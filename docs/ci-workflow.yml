name: Offline workflow checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m agent_lab demo
      - run: python -m agent_lab files-demo
      - run: python -m agent_lab memory-demo
      - run: python -m agent_lab protocol-demo
      - run: python -m agent_lab runner-demo
